<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Professionnel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/professionnel.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Rendez-vous</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Mes Rendez-vous</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Profil</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Section Profil -->
    <div class="container mt-4">
        <h2>Mon Profil</h2>
        <form id="profileForm">
            <div class="mb-3">
                <label class="form-label">Nom :</label>
                <input type="text" class="form-control" id="name" value="Dr. Dupont">
            </div>
            <div class="mb-3">
                <label class="form-label">Métier :</label>
                <input type="text" class="form-control" id="job" value="Médecin généraliste">
            </div>
            <div class="mb-3">
                <label class="form-label">Localisation :</label>
                <input type="text" class="form-control" id="location" value="Paris, France">
            </div>
            <button type="submit" class="btn btn-primary">Mettre à jour</button>
        </form>
    </div>

    <!-- Section Disponibilités -->
    <div class="container mt-5">
        <h2>Mes Disponibilités</h2>
        <form id="availabilityForm">
            <div class="mb-3">
                <label class="form-label">Date :</label>
                <input type="date" class="form-control" id="date">
            </div>
            <div class="mb-3">
                <label class="form-label">Heure :</label>
                <input type="time" class="form-control" id="time">
            </div>
            <button type="submit" class="btn btn-success">Ajouter Disponibilité</button>
        </form>
        <ul id="availabilityList" class="list-group mt-3">
            <!-- Les créneaux seront affichés ici -->
        </ul>
    </div>

    <!-- Section Rendez-vous -->
    <div class="container mt-5">
        <h2>Mes Rendez-vous</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>Client</th>
                    <th>Date</th>
                    <th>Heure</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="appointmentList">
                <tr>
                    <td>Jean Martin</td>
                    <td>10/03/2025</td>
                    <td>14:00</td>
                    <td>
                        <button class="btn btn-success">Accepter</button>
                        <button class="btn btn-danger">Annuler</button>
                    </td>
                </tr>
                <!-- D'autres rendez-vous seront affichés ici -->
            </tbody>
        </table>
    </div>

    <script src="js/professionnel.js"></script>
</body>

</html>
