<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Professionnel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/professionnel.css">
</head>

<body>
    <!-- Barre de navigation -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Verso</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/login.html" id="logout">Déconnexion</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Section Profil -->
    <div class="container mt-4">
        <h2>Mon Profil</h2>
        <form id="profileForm">
            <div class="mb-3">
                <label class="form-label">Nom :</label>
                <input type="text" class="form-control" id="name" value="Dr. Dupont" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Email :</label>
                <input type="email" class="form-control" id="email" value="dr.dupont@example.com" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Métier :</label>
                <input type="text" class="form-control" id="job" value="Médecin généraliste" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Localisation :</label>
                <input type="text" class="form-control" id="location" value="Paris, France" readonly>
            </div>
            <button type="button" id="editProfileBtn" class="btn btn-primary">Modifier le profil</button>
            <button type="submit" id="saveProfileBtn" class="btn btn-success d-none">Enregistrer</button>
        </form>
    </div>


    <!-- Section Rendez-vous -->
    <div class="container mt-5">
        <h2>Mes Rendez-vous</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>Client</th>
                    <th>Date</th>
                    <th>Heure</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="appointmentList">
                <tr>
                    <td>Jean Martin</td>
                    <td>10/03/2025</td>
                    <td>14:00</td>
                    <td>
                        <button class="btn btn-success">Accepter</button>
                        <button class="btn btn-danger">Annuler</button>
                    </td>
                </tr>
                <!-- D'autres rendez-vous seront affichés ici -->
            </tbody>
        </table>
    </div>



    <script src="js/professionnel.js"></script>
</body>

</html>
